stories:
- story_id: US-1
  title: Tạo ghi chú
  acs:
  - ac_id: AC-1.1
    text: '`POST /notes` với JSON `{"title": "<chuỗi>", "body": "<chuỗi>"}` hợp lệ
      trả 201. Response là JSON có `id` (số nguyên), `title` và `body` đúng bằng giá
      trị đã gửi.'
  - ac_id: AC-1.2
    text: Server lưu `title` và `body` nguyên văn, kể cả tiếng Việt có dấu, emoji
      và khoảng trắng đầu/cuối (không cắt khoảng trắng, không đổi chữ hoa/thường).
      `GET /notes/{id}` ngay sau đó trả lại đúng nguyên văn.
  - ac_id: AC-1.3
    text: '`title` là chuỗi rỗng, hoặc thiếu trong request, thì trả 422.'
  - ac_id: AC-1.4
    text: '`body` là chuỗi rỗng, hoặc thiếu trong request, thì trả 422.'
  - ac_id: AC-1.5
    text: '`title` dài hơn 200 ký tự thì trả 422. `title` dài đúng 200 ký tự vẫn hợp
      lệ (201).'
  - ac_id: AC-1.6
    text: '`body` dài hơn 5000 ký tự thì trả 422. `body` dài đúng 5000 ký tự vẫn hợp
      lệ (201).'
  - ac_id: AC-1.7
    text: '`title` hoặc `body` không phải chuỗi (số, boolean, null, mảng, đối tượng)
      thì trả 422.'
  - ac_id: AC-1.8
    text: Trên trang chủ, nhập tiêu đề và nội dung rồi bấm Thêm thì ghi chú mới hiện
      ngay trong danh sách, không cần tải lại trang.
- story_id: US-2
  title: Xem ghi chú
  acs:
  - ac_id: AC-2.1
    text: '`GET /notes` luôn trả 200 và một mảng JSON. Sau khi đã tạo ít nhất một
      ghi chú, mảng có ít nhất 1 phần tử.'
  - ac_id: AC-2.2
    text: '`GET /notes/{id}` với `id` của ghi chú đang tồn tại trả 200. Response có
      đúng `id`, `title` và `body` của ghi chú đó.'
  - ac_id: AC-2.3
    text: '`GET /notes/{id}` với `id` là số nhưng không có ghi chú tương ứng (ví dụ
      `999999`) trả 404. Response là JSON có trường `detail`.'
  - ac_id: AC-2.4
    text: '`GET /notes/{id}` với `id` không phải số (ví dụ `abc`, `-1`) trả 404, không
      phải 422 hay 5xx.'
  - ac_id: AC-2.5
    text: '`GET /notes/{id}` với `id` không phải số và rất dài (40 ký tự chữ) trả
      404, không bao giờ trả 5xx.'
  - ac_id: AC-2.6
    text: '`GET /notes/{id}` với `id` gồm 17 chữ số (ví dụ `11111111111111111`) trả
      404, không bao giờ trả 5xx.'
- story_id: US-3
  title: Xoá ghi chú
  acs:
  - ac_id: AC-3.1
    text: '`DELETE /notes/{id}` với ghi chú đang tồn tại trả 204 và không có body.'
  - ac_id: AC-3.2
    text: Sau khi xoá, `GET /notes/{id}` của ghi chú đó trả 404.
  - ac_id: AC-3.3
    text: Xoá lần thứ hai cùng một `id` trả 404.
  - ac_id: AC-3.4
    text: '`DELETE /notes/{id}` với `id` chưa từng tồn tại (ví dụ `999999` hoặc `abc`)
      trả 404.'
  - ac_id: AC-3.5
    text: Trên trang chủ, bấm Xoá cạnh một ghi chú thì ghi chú đó biến mất khỏi danh
      sách ngay, không cần tải lại trang.
- story_id: US-4
  title: Tóm tắt ghi chú
  acs:
  - ac_id: AC-4.1
    text: '`POST /notes/{id}/summarize` (không có body) với ghi chú đang tồn tại trả
      200. Response là JSON có `summary` (chuỗi), `model` bằng `stub-rule-v1` và `prompt_hash`
      gồm đúng 12 ký tự.'
  - ac_id: AC-4.2
    text: '`summary` là câu đầu tiên của `body`: phần đứng trước dấu chấm đầu tiên,
      đã bỏ khoảng trắng đầu/cuối, không chứa dấu chấm. Ví dụ `body` là `Hôm nay trời
      đẹp. Ngày mai mưa.` thì `summary` là `Hôm nay trời đẹp`.'
  - ac_id: AC-4.3
    text: Khi `body` không có dấu chấm, `summary` là `body` bỏ đi ký tự cuối cùng.
      Ví dụ `body` là `abcdef` thì `summary` là `abcde`. Nói chung `summary` luôn
      ngắn hơn `body` ít nhất 1 ký tự khi `body` dài từ 2 ký tự trở lên.
  - ac_id: AC-4.4
    text: '`body` chứa cụm `[[long]]` vẫn theo đúng AC-4.2, `summary` không bao giờ
      dài hơn `body`. Ví dụ `body` là `Ghi chú [[long]]. Chi tiết.` thì `summary`
      là `Ghi chú [[long]]`.'
  - ac_id: AC-4.5
    text: '`POST /notes/{id}/summarize` với `id` không tồn tại trả 404.'
  - ac_id: AC-4.6
    text: 'Tóm tắt không làm đổi ghi chú: sau khi gọi, `GET /notes/{id}` vẫn trả đúng
      `title` và `body` cũ.'
