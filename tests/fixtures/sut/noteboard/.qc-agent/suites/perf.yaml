# Suite của repo SUT (noteboard). Đường dẫn tương đối = tương đối repo SUT (worker chạy với cwd = SUT root).
# Lane chặn/không chặn do POLICY của qc-agent quyết định (configs/projects/noteboard.yaml), không do file này.
suite: perf
description: Load test k6 trên môi trường chạy thủ công (KHÔNG chạy trên PR)
tasks:
- task_id: t-002
  capability: http.load
  lane: gate
  intent: 'GET /notes chịu 10 VU trong 30s với p95 < 300ms (ngưỡng rộng: demo cơ chế,
    không phải số đo thật)'
  target:
    kind: http_service
    base_url: ${env.APP_BASE_URL}
  inputs:
    script: tests/perf/notes_list.js
    vus: 10
    duration: 30s
  oracle:
    kind: threshold
    assertions:
    - metric: http_req_duration.p95
      op: <
      value: 300
      unit: ms
    - metric: http_req_failed.rate
      op: <
      value: 0.01
  expected_result_kind: verdict
  budget:
    wallclock_s: 90
    tokens: 0
    usd: 0
  determinism:
    seed: null
    replayable: true
  evidence_required:
  - raw_output
  - stdout
  retry:
    max: 1
    'on':
    - error
  prefer:
  - k6
