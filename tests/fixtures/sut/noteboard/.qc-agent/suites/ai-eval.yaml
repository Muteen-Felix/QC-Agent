# Suite của repo SUT (noteboard). Đường dẫn tương đối = tương đối repo SUT (worker chạy với cwd = SUT root).
# Lane chặn/không chặn do POLICY của qc-agent quyết định (configs/projects/noteboard.yaml), không do file này.
suite: ai-eval
description: 'Eval AI: thu output + metric tất định (chặn merge ở mode pr)'
tasks:
- task_id: t-000
  capability: http.collect
  lane: gate
  intent: Thu thập input/output của API tóm tắt ghi chú qua golden set, làm nguồn
    cho t-003
  target:
    kind: http_service
    base_url: ${env.APP_BASE_URL}
  inputs:
    golden: tests/eval/golden.json
  oracle:
    kind: checks
    required:
    - all_http_2xx
    - count_matches_golden
  expected_result_kind: verdict
  budget:
    wallclock_s: 60
    tokens: 0
    usd: 0
  determinism:
    seed: null
    replayable: true
  evidence_required:
  - raw_output
  - stdout
  retry:
    max: 1
    'on':
    - error
  prefer:
  - http-collect
- task_id: t-003
  capability: llmapp.eval
  lane: gate
  intent: Đánh giá tóm tắt bằng metric tất định (gating) + G-Eval advisory (không
    chặn)
  target:
    kind: llm_app
    base_url: ${env.APP_BASE_URL}
  depends_on:
  - t-000
  inputs:
    outputs_path: ${runs_dir}/${run_id}/t-000/outputs.json
    judge_config:
      provider: openai
      model: gemini-3.5-flash-lite
      fallback_provider: gemini
      fallback_model: gemini-3.5-flash-lite
    sut_model: stub-rule-v1
  oracle:
    kind: checks
    required:
    - summary_not_empty
    - summary_shorter_than_body
    - summary_json_valid
  expected_result_kind: verdict
  budget:
    wallclock_s: 180
    tokens: 50000
    usd: 0.5
  determinism:
    seed: null
    replayable: true
  evidence_required:
  - raw_output
  - stdout
  retry:
    max: 1
    'on':
    - error
  prefer:
  - deepeval
