# Suite của repo SUT (noteboard). Đường dẫn tương đối = tương đối repo SUT (worker chạy với cwd = SUT root).
# Lane chặn/không chặn do POLICY của qc-agent quyết định (configs/projects/noteboard.yaml), không do file này.
suite: ui-explore
description: Khám phá UI bằng Midscene + canary (discovery, KHÔNG chặn)
tasks:
- task_id: t-101
  capability: ui.explore
  lane: discovery
  intent: 'Khám phá trang /: thêm note, xoá note; tìm trạng thái kẹt hoặc lỗi runtime'
  target:
    kind: web_app
    base_url: ${env.APP_BASE_URL}
    entry_path: /
  inputs:
    flow: midscene/explore_notes.yaml
    max_steps: 8
    promote_hints:
      dom_unchanged:
        repro_steps:
        - mở /
        - thêm một note
        - bấm Xoá
        suggested_assertion: sau khi bấm Xoá, note không còn trong danh sách
  oracle:
    kind: implicit_signals
    signals:
    - console_error
    - http_5xx
    - dom_unchanged
    - element_not_found
    llm_observations_allowed: true
  expected_result_kind: candidate_finding
  budget:
    wallclock_s: 600
    tokens: 150000
    usd: 1.0
  determinism:
    seed: null
    replayable: false
  evidence_required:
  - raw_output
  retry:
    max: 0
    'on': []
  prefer:
  - midscene-cli
- task_id: t-canary-01
  capability: ui.explore
  lane: discovery
  intent: 'CANARY: task chắc chắn phải fail (nút ''Thanh toán'' không tồn tại). Worker
    báo pass = worker hỏng, không phải app tốt'
  target:
    kind: web_app
    base_url: ${env.APP_BASE_URL}
    entry_path: /
  expect_status: fail
  inputs:
    flow: midscene/canary_checkout.yaml
    max_steps: 8
  oracle:
    kind: implicit_signals
    signals:
    - element_not_found
    llm_observations_allowed: false
  expected_result_kind: candidate_finding
  budget:
    wallclock_s: 300
    tokens: 80000
    usd: 0.5
  determinism:
    seed: null
    replayable: false
  evidence_required:
  - raw_output
  retry:
    max: 0
    'on': []
  prefer:
  - midscene-cli
