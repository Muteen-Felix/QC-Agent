# qc-agent:generated — suite secret (gitleaks). Chặn merge hay không do POLICY của qc-agent quyết định, không do file này.
# Quét working tree (secret MỚI đưa vào PR này); `history: true` quét cả lịch sử git nhưng cần checkout fetch-depth: 0.
# Bỏ qua một finding có lý do: thêm fingerprint vào `.gitleaksignore` (hiện trong diff PR để người review thấy).
suite: secrets
description: Quét secret bằng gitleaks, báo cáo luôn redact (chặn merge ở mode pr)
tasks:
- task_id: t-011
  capability: code.secret
  lane: gate
  intent: 'Secret: không có secret/token nào trong mã nguồn'
  target:
    kind: source_tree
    base_url: ${env.APP_BASE_URL}
  inputs:
    source: .
    history: false
  oracle:
    kind: threshold
    assertions:
    - metric: gitleaks.count
      op: ==
      value: 0
  expected_result_kind: verdict
  budget:
    wallclock_s: 180
    tokens: 0
    usd: 0
  determinism:
    seed: 0
    replayable: true
  evidence_required:
  - raw_output
  - stdout
  retry:
    max: 1
    'on':
    - error
  prefer:
  - gitleaks
