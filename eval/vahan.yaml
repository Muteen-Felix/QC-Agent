# Đo Ground-Truth (agent) trên MỘT SUT thật: vahan-automation / apps/api-server (FastAPI). Dùng với tools/eval_gt_sut.py, đường dẫn tương đối tính từ FILE NÀY.
# Chuẩn bị một lần:  powershell -ExecutionPolicy Bypass -File eval\vahan\prepare.ps1   (snapshot đúng commit + venv; xem runs\vahan-sut.source)
# Kiểm khô $0:       python tools/eval_gt_sut.py --config eval/vahan.yaml --check-only
#
# Công cụ đo là chung cho mọi SUT; mọi thứ riêng của vahan (PRD, mutant, nhãn, lớp bọc auth) nằm trong eval/vahan.yaml và eval/vahan/, không có trong src/ hay tools/.
name: vahan-api-server
sut_root: ../runs/vahan-sut          # snapshot sạch: không có tests/ của dev và không có .venv (agent chỉ đọc được đây)
prd: ../../vahan-automation/docs/prd/vahan.md
openapi: vahan/openapi.json          # xuất từ chính mã snapshot (fastapi_app.openapi()), không viết tay

# NHÃN DO AI SOẠN, chưa có QA người ký. Tài liệu (docs/groundtruth-real-sut.md) yêu cầu người gán nhãn không phải người viết prompt/PRD và tốt nhất là QA:
# trước khi dùng số đo làm bằng chứng cho hội đồng, một người đọc lại `non_testable` và `mutants` bên dưới rồi đổi dòng này thành tên người đó.
labeled_by: "AI draft (Claude Sonnet 5.5, 2026-10-03), viết từ PRD + mã SUT TRƯỚC khi agent chạy lần nào; CHƯA có QA duyệt"

# AC không kiểm được bằng HTTP thuần trong môi trường đo (runner-less, auth mở). Loại khỏi mẫu số coverage (a). Lý do theo nhóm:
#   Socket.IO / Chrome extension / React UI: toàn bộ US-2 (trừ 2.6), US-3, US-6, US-7, US-8, US-15, US-16 và AC-4.8, 5.4, 5.5, 9.1, 9.2, 10.1, 13.4, 13.5
#   cần một runner đã kết nối (Socket.IO) để có Job hoặc trạng thái runner: AC-4.1, 4.3, 4.5, 4.6, 5.1, 5.2, 9.3-9.10, 10.2-10.4, 11.4, 11.6, 13.1
#   không quan sát được qua HTTP: AC-14.2 (BOM trong file CSV, sự kiện Socket.IO)
#   hồ sơ đo TẮT auth trong bản sao (eval/vahan/prepare.ps1 vá app/main.py): AC-1.6, 1.8 (401 do middleware); AC-1.4 cần server CHƯA cấu hình auth
# (Lần đo 1 dùng lớp bọc ASGI gắn token; agent đọc mã thấy middleware đòi Bearer nên waive gần hết endpoint, nên đã thay bằng hồ sơ tắt auth ngay trong mã bản sao.)
