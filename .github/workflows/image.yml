# Build và publish image qc-agent lên GHCR: ghcr.io/muteen-felix/qc-agent
#   - PR: chỉ build + smoke test (không push)
#   - push vào main: publish :main và :sha-<7 ký tự>
#   - tag vX.Y.Z: publish :X.Y.Z và :X.Y
# Repo SUT KHÔNG dùng tag mà ghim theo DIGEST (`ghcr.io/muteen-felix/qc-agent@sha256:...`): digest hiện ở Job Summary của run này.
# Các action ghim theo commit SHA (không phải tag có thể bị dời): nâng phiên bản = đổi SHA có chủ đích.
name: image

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, docker/**, pyproject.toml, uv.lock, package.json, package-lock.json, src/**, schemas/**, workers/**, configs/**, web/**, .github/workflows/image.yml]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/muteen-felix/qc-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # chỉ dùng khi push (không PR)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}   # PR: nạp vào daemon để smoke test
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: QC_AGENT_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (PR)
        if: github.event_name == 'pull_request'
        run: |
          IMG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          docker run --rm "$IMG" --help
          docker run --rm --entrypoint sh "$IMG" -c 'id -un && k6 version && st --version && npx @midscene/cli --version && node --version'
      - name: Digest (dùng để ghim ở repo SUT)
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
