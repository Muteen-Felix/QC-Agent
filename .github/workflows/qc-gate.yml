# Rủi ro còn lại khi đọc log CI:
#   - orchestrator.py gọi Midscene (LLM thật) + DeepEval => tốn tiền mỗi lần PR mở/cập nhật.
#   - Phụ thuộc Python cài bằng `uv sync --frozen` từ uv.lock (đa nền tảng); lock lỗi thì job đỏ, không tự lùi về bản không ghim.
#   - job `qc-gate` LUÔN chạy toyapp sạch (QC_BUGS=none): gate trên PR phải PASS khi code sạch,
#     không lẫn với việc "gate có bắt được bug đã gài" (test riêng bằng workflow_dispatch + qc_bugs).
#
# Bật gate chặn merge: Settings -> Branches -> branch protection rule cho `main` -> yêu cầu job
# `qc-gate` phải xanh trước khi merge.

name: QC Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qc_bugs:
        description: 'QC_BUGS cho toyapp (rỗng = "none" = tắt hết bug; mặc định "1,2,3")'
        required: false
        default: "none"

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # Job 1: suite gốc của repo (core/adapters/schemas/workers) — không đụng LLM, không đụng toyapp.
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      QC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install uv
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run unit tests (tests/)
        run: python -m pytest tests/ -q

  # Job 2: gate thật — toyapp + orchestrator.py --project noteboard --mode pr (5 task: schemathesis/k6/deepeval/midscene/canary/collect).
  qc-gate:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          pip install uv
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Node deps (Midscene CLI)
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - uses: grafana/setup-k6-action@v1

      - name: Start toy SUT (toyapp) in background
        env:
          # pull_request: luôn "none" — gate trên PR đánh giá code sạch, không lẫn bug cố ý gài.
          # workflow_dispatch: cho phép chọn qc_bugs để tự kiểm "gate có bắt được bug đã biết không".
          QC_BUGS: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.qc_bugs || 'none') || 'none' }}
        run: |
          python -m uvicorn --app-dir tests/fixtures/sut/noteboard toyapp.app:app --host 127.0.0.1 --port 8000 \
            > toyapp.out.log 2> toyapp.err.log &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/__qc/config && break
            sleep 1
          done

      - name: Run QC gate (orchestrator.py)
        env:
          APP_BASE_URL: "http://127.0.0.1:8000"
          # Secrets phải cấu hình ở Settings -> Secrets and variables -> Actions của repo.
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          QC_JUDGE_PROVIDER: ${{ secrets.QC_JUDGE_PROVIDER }}
          QC_JUDGE_MODEL: ${{ secrets.QC_JUDGE_MODEL }}
          QC_JUDGE_FALLBACK_PROVIDER: ${{ secrets.QC_JUDGE_FALLBACK_PROVIDER }}
          QC_JUDGE_FALLBACK_MODEL: ${{ secrets.QC_JUDGE_FALLBACK_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python orchestrator.py run --project noteboard --mode pr --sut-root tests/fixtures/sut/noteboard
        # exit 0 = gate PASS, exit 1 = gate FAIL (job đỏ, chặn merge nếu bật branch protection),
        # exit khác = lỗi hệ thống (cũng chặn merge).

      - name: Upload run artifacts (report.json, evidence, midscene report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-run-${{ github.run_number }}
          path: |
            runs/
            tests/fixtures/sut/noteboard/midscene_run/report/
          retention-days: 14

      - name: Notify webhook (Slack/Discord/Telegram) — qc_agent.integrations.notify
        if: always()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          RUN=$(ls -d runs/r-* 2>/dev/null | sort | tail -1)
          if [ -n "$RUN" ]; then
            python -m qc_agent.integrations.notify --run-dir "$RUN" --exit-code "${{ job.status == 'success' && 0 || 1 }}"
          fi
