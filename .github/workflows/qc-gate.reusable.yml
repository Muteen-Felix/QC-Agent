# Workflow TÁI SỬ DỤNG: chạy qc-agent (mode tự động) trên một PR của MỘT repo SUT bất kỳ.
#
# Repo SUT gọi:
#   jobs:
#     qc:
#       permissions: { contents: read, checks: write, pull-requests: write, packages: read }
#       uses: Muteen-Felix/QC-Agent/.github/workflows/qc-gate.reusable.yml@<COMMIT-SHA>
#       with:
#         project: noteboard
#         image: ghcr.io/muteen-felix/qc-agent@sha256:<DIGEST>
#       secrets: inherit
# Xem docs/usage-ci.md. Bật chặn merge: branch protection của SUT yêu cầu job này xanh.
#
# POLICY: gate đọc chính sách (configs/projects/) TỪ NHÁNH `main` CỦA qc-agent lúc chạy (bước "Fetch policy"), không đọc bản đóng gói trong image;
# lấy không được thì job ĐỎ (không fallback). Repo chưa đăng ký dùng `_default.yaml`. Mô hình tin cậy: tin team SUT, chỉ chống sơ suất.
#
# Luồng: build + chạy SUT của PR (và web UI nếu khai sut_ui_dockerfile) trong container tạm -> chạy image qc-agent (CLI) trên mạng docker riêng -> báo cáo (Check Run,
# comment dính, lịch sử tập trung, webhook) -> upload artifact -> job xanh/đỏ THEO EXIT CODE của gate (báo cáo lỗi không đổi kết quả).
#
# AN TOÀN: đầu vào (inputs) và bí mật đều đi qua biến môi trường của step, KHÔNG nội suy ${{ }} vào script (chống chèn lệnh);
# bí mật truyền vào container bằng `-e NAME` (không nằm trên dòng lệnh); mọi action ghim theo commit SHA; image qc-agent phải ghim
# theo digest (trừ khi allow_unpinned_image). Code của PR là input KHÔNG TIN CẬY: chạy trong container không phải root, mạng docker riêng.
# Rủi ro còn lại: worker eval của chính repo SUT (vd. pytest tests/eval) chạy mã của PR với các key LLM trong env — dùng key giới hạn ngân sách.
name: qc-gate (reusable)

env:
  # Repo chứa policy. HARD-CODE vì trong workflow_call `github.repository` là repo GỌI, không phải qc-agent. Fork/đổi tên repo thì sửa đúng chỗ này.
  QC_AGENT_REPO: Muteen-Felix/QC-Agent

on:
  workflow_call:
    inputs:
      project:
        description: "slug project trong configs/projects/ của qc-agent"
        required: true
        type: string
      image:
        description: "image qc-agent, GHIM THEO DIGEST: ghcr.io/muteen-felix/qc-agent@sha256:..."
        required: true
        type: string
      mode:
        type: string
        default: pr
      suites:
        description: "chỉ chạy các suite này (cách nhau dấu phẩy); mặc định theo policy của mode"
        type: string
        default: ""
      sut_dockerfile:
        type: string
        default: Dockerfile
      sut_context:
        type: string
        default: "."
      sut_port:
        type: string
        default: "8000"
      sut_health_path:
        type: string
        default: "/"
      sut_base_url:
        description: "URL của SUT có sẵn: bỏ qua bước build/chạy SUT"
        type: string
        default: ""
      sut_env:
        description: "KEY=VALUE mỗi dòng cho container SUT (KHÔNG đặt bí mật ở đây)"
        type: string
        default: ""
      sut_ui_dockerfile:
        description: "Dockerfile của web UI (tuỳ chọn): có thì dựng thêm container `ui` để suite UI (Midscene) dùng qua APP_UI_URL"
        type: string
        default: ""
      sut_ui_context:
        type: string
        default: "."
      sut_ui_port:
        type: string
        default: "8080"
      sut_ui_health_path:
        type: string
        default: "/"
      sut_ui_build_args:
        description: "KEY=VALUE mỗi dòng cho `docker build` của UI, vd. VITE_API_URL=http://sut:8000 (KHÔNG đặt bí mật: build-arg nằm trong lớp image)"
        type: string
        default: ""
      qc_api_url:
        description: "gốc URL của service qc-agent để lưu lịch sử (cần secret QC_API_TOKEN)"
        type: string
        default: ""
      allow_unpinned_image:
        description: "cho phép image không ghim digest (KHÔNG khuyến nghị)"
        type: boolean
        default: false
      refine:
        description: "auto = trên PR, nếu repo còn marker qc-agent (REFINE/SUGGESTED), đề xuất phần cần dữ liệu sống bằng review ```suggestion``` + artifact refine.patch; off = tắt"
        type: string
        default: auto
      timeout_minutes:
        type: number
        default: 30
    secrets:
      qc_read_token: { required: false }   # đọc policy (contents:read) + kéo image (read:packages) khi repo qc-agent/image chuyển private
      QC_API_TOKEN: { required: false }
      GHCR_PULL_TOKEN: { required: false }
      OPENAI_API_KEY: { required: false }
      GEMINI_API_KEY: { required: false }
      MIDSCENE_MODEL_BASE_URL: { required: false }
      MIDSCENE_MODEL_API_KEY: { required: false }
      MIDSCENE_MODEL_NAME: { required: false }
      MIDSCENE_MODEL_FAMILY: { required: false }
      QC_JUDGE_PROVIDER: { required: false }
      QC_JUDGE_MODEL: { required: false }
      QC_JUDGE_FALLBACK_PROVIDER: { required: false }
      QC_JUDGE_FALLBACK_MODEL: { required: false }
      ALERT_WEBHOOK_URL: { required: false }
      ALERT_TELEGRAM_CHAT_ID: { required: false }
      DASHBOARD_URL: { required: false }
    outputs:
      gate_exit_code:
        description: "exit code của gate (0 = PASS, 1 = FAIL, 3 = lỗi hệ thống/cấu hình)"
        value: ${{ jobs.gate.outputs.exit_code }}

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  gate:
    name: qc-agent / ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      exit_code: ${{ steps.gate.outputs.exit_code }}
    concurrency:
      group: qc-gate-${{ inputs.project }}-${{ inputs.mode }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true   # push liên tục vào PR: huỷ lần chạy cũ
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: startsWith(inputs.image, 'ghcr.io/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN || secrets.qc_read_token || secrets.GITHUB_TOKEN }}

      - name: Pull qc-agent image
        env:
          IMAGE: ${{ inputs.image }}
          ALLOW_UNPINNED: ${{ inputs.allow_unpinned_image }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            *@sha256:*) ;;
            *) if [ "$ALLOW_UNPINNED" != "true" ]; then
                 echo "::error::image phải ghim theo digest (name@sha256:...), nhận: $IMAGE"; exit 1
               fi
               echo "::warning::image không ghim theo digest: $IMAGE" ;;
          esac
          docker pull "$IMAGE"

      - name: Fetch policy
        id: policy
        env:
          PROJECT: ${{ inputs.project }}
          POLICY_TOKEN: ${{ secrets.qc_read_token || github.token }}
        run: |
          set -euo pipefail
          # policy = configs/projects/{_default,<slug>}.yaml của qc-agent@main, để NGOÀI workspace SUT (PR có thể commit sẵn thư mục trùng tên,
          # và /work được mount vào container gate). Lấy không được => dừng job: KHÔNG dùng snapshot trong image.
          if ! [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then echo "::error::project không hợp lệ: $PROJECT"; exit 1; fi
          dest="$RUNNER_TEMP/qc-policy"
          rm -rf "$dest"; mkdir -p "$dest"
          api="${GITHUB_API_URL:-https://api.github.com}/repos/${QC_AGENT_REPO}"
          get() {  # $1 = URL, $2 = Accept, $3 = file ra; in mã HTTP. Token đi qua stdin của curl, không nằm trên dòng lệnh
            printf 'header = "Authorization: Bearer %s"\n' "$POLICY_TOKEN" | curl -sS -K - --max-time 20 -o "$3" -w '%{http_code}' \
              -H "Accept: $2" -H 'X-GitHub-Api-Version: 2022-11-28' "$1" || echo 000
          }
          code=$(get "$api/contents/configs/projects/_default.yaml?ref=main" 'application/vnd.github.raw+json' "$dest/_default.yaml")
          if [ "$code" != 200 ]; then echo "::error::không lấy được policy _default.yaml từ ${QC_AGENT_REPO}@main (HTTP $code)"; exit 1; fi
          code=$(get "$api/contents/configs/projects/${PROJECT}.yaml?ref=main" 'application/vnd.github.raw+json' "$dest/${PROJECT}.yaml")
          case "$code" in
            200) ;;
            404) rm -f "$dest/${PROJECT}.yaml"; echo "project ${PROJECT} chưa đăng ký: dùng _default" ;;
            *) echo "::error::không lấy được policy ${PROJECT}.yaml từ ${QC_AGENT_REPO}@main (HTTP $code)"; exit 1 ;;
          esac
          ref_file=$(mktemp)
          code=$(get "$api/commits/main" 'application/vnd.github.sha' "$ref_file")
          ref=$(cat "$ref_file")
          if [ "$code" != 200 ] || ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::không xác định được commit của ${QC_AGENT_REPO}@main (HTTP $code)"; exit 1; fi
          chmod -R a+rX "$dest"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "policy: ${QC_AGENT_REPO}@main = $ref"

      - name: Start SUT
        id: sut
        env:
          IMAGE: ${{ inputs.image }}
          SUT_BASE_URL: ${{ inputs.sut_base_url }}
          SUT_DOCKERFILE: ${{ inputs.sut_dockerfile }}
          SUT_CONTEXT: ${{ inputs.sut_context }}
          SUT_PORT: ${{ inputs.sut_port }}
          SUT_HEALTH_PATH: ${{ inputs.sut_health_path }}
          SUT_ENV: ${{ inputs.sut_env }}
          SUT_UI_DOCKERFILE: ${{ inputs.sut_ui_dockerfile }}
          SUT_UI_CONTEXT: ${{ inputs.sut_ui_context }}
          SUT_UI_PORT: ${{ inputs.sut_ui_port }}
          SUT_UI_HEALTH_PATH: ${{ inputs.sut_ui_health_path }}
          SUT_UI_BUILD_ARGS: ${{ inputs.sut_ui_build_args }}
        run: |
          set -euo pipefail
          docker network create qc-net
          # sẵn sàng = server trả lời HTTP (mọi mã, kể cả 404); dùng chính image qc-agent (đã ghim) để thăm dò trong mạng docker
          PROBE='import sys, urllib.request as u, urllib.error as e
          try:
              u.urlopen(sys.argv[1], timeout=2)
          except e.HTTPError:
              pass'
          wait_ready() {  # $1 = tên container, $2 = URL thăm dò
            local ready=0
            for _ in $(seq 1 60); do
              if docker run --rm --network qc-net --entrypoint python "$IMAGE" -c "$PROBE" "$2" 2>/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then
              docker logs "$1" 2>&1 | tail -50
              echo "::error::$1 không sẵn sàng sau 120s"; exit 1
            fi
          }
          if [ -n "$SUT_BASE_URL" ]; then
            echo "base_url=$SUT_BASE_URL" >> "$GITHUB_OUTPUT"
          else
            docker build -f "$SUT_DOCKERFILE" -t qc-sut "$SUT_CONTEXT"
            env_args=()
            while IFS= read -r line; do [ -n "$line" ] && env_args+=(-e "$line"); done <<< "$SUT_ENV"
            docker run -d --name sut --network qc-net "${env_args[@]}" qc-sut
            wait_ready sut "http://sut:${SUT_PORT}${SUT_HEALTH_PATH}"
            echo "base_url=http://sut:${SUT_PORT}" >> "$GITHUB_OUTPUT"
          fi
          # web UI (tuỳ chọn): container `ui` cùng mạng; trình duyệt của Midscene chạy trong container gate nên phân giải được `sut` và `ui`
          if [ -n "$SUT_UI_DOCKERFILE" ]; then
            build_args=()
            while IFS= read -r line; do [ -n "$line" ] && build_args+=(--build-arg "$line"); done <<< "$SUT_UI_BUILD_ARGS"
            docker build -f "$SUT_UI_DOCKERFILE" "${build_args[@]}" -t qc-sut-ui "$SUT_UI_CONTEXT"
            docker run -d --name ui --network qc-net qc-sut-ui
            wait_ready ui "http://ui:${SUT_UI_PORT}${SUT_UI_HEALTH_PATH}"
            echo "ui_url=http://ui:${SUT_UI_PORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Refine (onboarding suggestions)
        id: refine
        if: github.event_name == 'pull_request' && inputs.refine != 'off'
        continue-on-error: true   # refine lỗi không được làm hỏng gate
        env:
          IMAGE: ${{ inputs.image }}
          BASE_URL: ${{ steps.sut.outputs.base_url }}
          UI_URL: ${{ steps.sut.outputs.ui_url }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
        run: |
          set -uo pipefail
          # Chỉ chạy khi repo còn marker của qc-agent (Pha 1 chưa được điền/duyệt xong). Workspace được mount CHỈ-ĐỌC; kết quả ghi vào $RUNNER_TEMP/refine.
          if ! grep -rlE 'qc-agent:todo (REFINE|SUGGESTED)|qc-agent:begin refine' .qc-agent .github/workflows/qc.yml >/dev/null 2>&1; then
            echo "refine: không còn marker REFINE/SUGGESTED, bỏ qua"; exit 0
          fi
          out="$RUNNER_TEMP/refine"; rm -rf "$out"; mkdir -p "$out"; chmod 777 "$out"
          schema_path=$(sed -n 's#^ *schema_url: [$]{env.APP_BASE_URL}\(/[^ ]*\).*#\1#p' .qc-agent/suites/api-contract.yaml 2>/dev/null | head -1)
          ui_args=()
          # gợi ý flow UI cần UI đang chạy + khoá LLM; PR từ fork không có secret nên tự bỏ qua
          if [ -n "${UI_URL:-}" ] && [ -n "${MIDSCENE_MODEL_API_KEY:-}" ]; then ui_args=(--suggest-ui --ui-url "$UI_URL"); fi
          docker run --rm --network qc-net --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work:ro" -v "$out:/out" -w /work \
            -e MIDSCENE_MODEL_BASE_URL -e MIDSCENE_MODEL_API_KEY -e MIDSCENE_MODEL_NAME -e MIDSCENE_MODEL_FAMILY \
            "$IMAGE" init --refine --sut-root /work --openapi "${BASE_URL}${schema_path:-/openapi.json}" --out /out "${ui_args[@]}"
          if [ -s "$out/refine.patch" ]; then echo "has_patch=true" >> "$GITHUB_OUTPUT"; else echo "refine: không có gì để đề xuất"; fi

      - name: Post refine review
        if: always() && steps.refine.outputs.has_patch == 'true'
        continue-on-error: true   # fork: GITHUB_TOKEN chỉ-đọc => không đăng được, chỉ còn artifact
        env:
          IMAGE: ${{ inputs.image }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$RUNNER_TEMP/refine:/out:ro" \
            -v "$GITHUB_EVENT_PATH:/tmp/event.json:ro" -e GITHUB_EVENT_PATH=/tmp/event.json \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_API_URL -e GITHUB_TOKEN \
            --entrypoint python "$IMAGE" -m qc_agent.integrations.ci --refine-dir /out

      - name: Upload refine patch
        if: always() && steps.refine.outputs.has_patch == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qc-refine-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/refine/refine.patch
            ${{ runner.temp }}/refine/suggestions.json
          retention-days: 14

      - name: Run qc-agent gate
        id: gate
        env:
          IMAGE: ${{ inputs.image }}
          PROJECT: ${{ inputs.project }}
          MODE: ${{ inputs.mode }}
          SUITES: ${{ inputs.suites }}
          BASE_URL: ${{ steps.sut.outputs.base_url }}
          UI_URL: ${{ steps.sut.outputs.ui_url }}
          SUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          QC_POLICY_REF: ${{ steps.policy.outputs.ref }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
          QC_JUDGE_PROVIDER: ${{ secrets.QC_JUDGE_PROVIDER }}
          QC_JUDGE_MODEL: ${{ secrets.QC_JUDGE_MODEL }}
          QC_JUDGE_FALLBACK_PROVIDER: ${{ secrets.QC_JUDGE_FALLBACK_PROVIDER }}
          QC_JUDGE_FALLBACK_MODEL: ${{ secrets.QC_JUDGE_FALLBACK_MODEL }}
        run: |
          set +e   # exit code của gate được ghi lại để bước báo cáo chạy xong rồi bước cuối mới quyết định xanh/đỏ
          mkdir -p runs
          args=(run --project "$PROJECT" --mode "$MODE" --sut-root /work --runs-dir /work/runs --sut-ref "$SUT_REF"
                --projects-dir /policy --expect-repo "$GITHUB_REPOSITORY")
          if [ -n "$SUITES" ]; then args+=(--suites "$SUITES"); fi
          ui_args=(); if [ -n "${UI_URL:-}" ]; then ui_args=(-e APP_UI_URL="$UI_URL"); fi
          docker run --rm --network qc-net --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -v "$RUNNER_TEMP/qc-policy:/policy:ro" -w /work \
            -e APP_BASE_URL="$BASE_URL" -e QC_POLICY_REF "${ui_args[@]}" \
            -e OPENAI_API_KEY -e GEMINI_API_KEY \
            -e MIDSCENE_MODEL_BASE_URL -e MIDSCENE_MODEL_API_KEY -e MIDSCENE_MODEL_NAME -e MIDSCENE_MODEL_FAMILY \
            -e QC_JUDGE_PROVIDER -e QC_JUDGE_MODEL -e QC_JUDGE_FALLBACK_PROVIDER -e QC_JUDGE_FALLBACK_MODEL \
            "$IMAGE" "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Report (Check Run, PR comment, history, webhook)
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
          PROJECT: ${{ inputs.project }}
          MODE: ${{ inputs.mode }}
          EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
          GITHUB_TOKEN: ${{ github.token }}
          QC_API_URL: ${{ inputs.qc_api_url }}
          QC_API_TOKEN: ${{ secrets.QC_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          RUN=$(ls -d runs/r-* 2>/dev/null | sort | tail -1 || true)
          if [ -z "$RUN" ]; then echo "::warning::không có run nào để báo cáo"; exit 0; fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -v "$RUNNER_TEMP/qc-policy:/policy:ro" -w /work \
            -e QC_PROJECTS_DIR=/policy -v "$GITHUB_EVENT_PATH:/tmp/event.json:ro" -e GITHUB_EVENT_PATH=/tmp/event.json \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SERVER_URL -e GITHUB_API_URL \
            -e GITHUB_TOKEN -e QC_API_URL -e QC_API_TOKEN -e ALERT_WEBHOOK_URL -e ALERT_TELEGRAM_CHAT_ID -e DASHBOARD_URL \
            --entrypoint python "$IMAGE" -m qc_agent.integrations.ci --run-dir "$RUN" --project "$PROJECT" --mode "$MODE" ${EXIT_CODE:+--exit-code "$EXIT_CODE"}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qc-runs-${{ inputs.project }}-${{ github.run_attempt }}
          path: runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up SUT
        if: always()
        run: |
          docker rm -f sut ui >/dev/null 2>&1 || true
          docker network rm qc-net >/dev/null 2>&1 || true

      - name: Enforce gate result
        if: always()
        env:
          EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          if [ "${EXIT_CODE:-}" = "0" ]; then echo "qc-agent gate: PASS"; exit 0; fi
          echo "::error::qc-agent gate không đạt (exit ${EXIT_CODE:-không chạy được}); chi tiết ở comment PR / Check Run / artifact"
          exit 1
