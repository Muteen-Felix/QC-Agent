name: k6
version_probe: "k6 version"
adapter: "qc_agent/adapters/k6_adapter.py"
lanes: [gate, discovery]   # gate: perf-full (thủ công); discovery: perf-smoke trên PR (không chặn)
capabilities:
  - id: http.load
    oracle_kinds: [threshold]
    verdict_sources: [deterministic_assert]
    parallel_safe: false
requires:
  env: [APP_BASE_URL]
  binaries: [k6]
data_egress: []
cost_profile: { tokens_per_run: 0, typical_wallclock_s: 60 }
