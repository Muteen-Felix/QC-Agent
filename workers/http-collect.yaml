name: http-collect
version_probe: "python --version"
adapter: "adapters/collect_adapter.py"
lanes: [gate]
capabilities:
  - id: http.collect
    oracle_kinds: [checks]
    verdict_sources: [deterministic_assert]
    parallel_safe: true
requires:
  env: [APP_BASE_URL]
  binaries: []
data_egress: []
cost_profile: {tokens_per_run: 0, typical_wallclock_s: 10}
