name: deepeval
version_probe: "deepeval --version"
adapter: "qc_agent/adapters/deepeval_adapter.py"
lanes: [gate, discovery]
capabilities:
  - id: llmapp.eval
    oracle_kinds: [checks]
    verdict_sources: [deterministic_assert, llm_judgment]
    # metric tất định do suite khai ở inputs.metrics (not_empty | shorter_than | max_len | regex_present | regex_absent | json_schema);
    # tuỳ chọn inputs.collect tự thu output của SUT qua HTTP; inputs.geval khai tiêu chí G-Eval advisory (+ baseline)
    advisory_metrics: [GEval]
    parallel_safe: true
requires:
  env: []
  binaries: []
data_egress: [app_input, app_output]
cost_profile: {tokens_per_run: 50000, typical_wallclock_s: 180}
