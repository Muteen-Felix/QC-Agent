# Project `vahan-rpa` — ĐĂNG KÝ MỎNG, kế thừa _default.yaml (blocking_suites, on_skipped_gate_task, mode manual) qua deep-merge
# (list THAY, không cộng dồn — xem core/project.py:deep_merge). Chỉ khai những key cần khác _default. TẬP TRUNG: đổi file này phải qua PR vào qc-agent.
# Suite (nội dung task) nằm trong repo SUT tại suites_dir.
slug: vahan-rpa
name: "VAHAN Report Automation"
repo: "Muteen-Felix/vahan-rpa"
modes:
  pr:
    advisory_suites: [perf-smoke, ui-explore, coverage-debt]  # = advisory_suites của _default + coverage-debt (list thay, phải khai đủ)
    advisory_yellow_suites: [coverage-debt]  # P2-8: suite trên fail => YELLOW, không PASS im lặng (docs/phase2/plan-debt.md)
    # blocking_suites và on_skipped_gate_task giữ nguyên từ _default.yaml (không khai lại ở đây)
    # LƯU Ý VẬN HÀNH: suite chỉ chạy khi repo vahan-rpa có .qc-agent/suites/coverage-debt.yaml (mẫu ở
    # qc-agent init hoặc templates.coverage_debt_suite()); tới lúc đó `advisory_yellow_suites` nhắc một
    # suite vắng mặt và `qc-agent validate` sẽ WARN (không chặn) cho tới khi suite đó được thêm ở repo SUT.
