# Chính sách MẶC ĐỊNH của phòng QC — mọi repo chưa đăng ký dùng file này. TẬP TRUNG: đổi file này phải qua PR vào qc-agent
# (gate CI đọc nó từ nhánh main lúc chạy, nên một merge ảnh hưởng ngay PR của MỌI team).
# Không có slug/repo: tên bắt đầu bằng "_" nên không thể trùng slug thật. Project đăng ký (<slug>.yaml) kế thừa file này:
# deep merge theo key, LIST THAY THẾ (không cộng dồn). modes.pr.blocking_suites không được rỗng.
severity:
  block_on: [critical, medium]
  default_severity: {"*": medium}
modes:
  pr:                                  # tự động, mỗi PR
    blocking_suites: [api-contract, sast, secrets, deps]   # mọi task lane=gate: chặn merge
    advisory_suites: [perf-smoke, ui-explore, coverage-debt]  # mọi task lane=discovery: chỉ tham khảo, không chặn
    on_skipped_gate_task: fail         # task chặn mà bị bỏ qua thì KHÔNG được xanh giả
    floor_workers: [gitleaks, semgrep]
    full_set_paths: [Dockerfile, "**/Dockerfile*", "docker-compose*.y*ml", package.json, package-lock.json, pnpm-lock.yaml, yarn.lock, "requirements*.txt", pyproject.toml, uv.lock, poetry.lock, "Pipfile*", go.mod, go.sum, ".github/workflows/**", ".qc-agent/**"]
    docs_paths: ["docs/**", "**/*.md", "**/*.rst", "**/*.adoc", "LICENSE*", "CHANGELOG*"]
    max_parallel: 1
  manual:                              # chạy tay trên web/API; lane giữ như suite khai báo
    suites: "*"
